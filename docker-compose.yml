version: '3.8'

services:
  auth-db:
    image: postgres:14.3
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - auth_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: auth-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  auth_data:
  redis_data:
